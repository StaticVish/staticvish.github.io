<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #ffffff; font-family: sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="50" y="50" width="180" height="80" rx="10" fill="#a5d8ff" stroke="#333" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">1. Write Draft</text>
  <text x="140" y="110" text-anchor="middle" font-size="14" fill="#555">(Vish)</text>

  <line x1="230" y1="90" x2="290" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="50" width="180" height="80" rx="10" fill="#d0bfff" stroke="#333" stroke-width="2"/>
  <text x="390" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">2. Feature PR</text>
  <text x="390" y="110" text-anchor="middle" font-size="14" fill="#555">(Hermes via gh CLI)</text>

  <line x1="480" y1="90" x2="540" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 640 50 L 730 90 L 640 130 L 550 90 Z" fill="#ffd8a8" stroke="#333" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">3. Playwright</text>
  <text x="640" y="110" text-anchor="middle" font-size="14" fill="#555">E2E Tests</text>

  <!-- Connection Row 1 to 2 -->
  <line x1="640" y1="130" x2="640" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="190" font-size="14" fill="#2b8a3e" font-weight="bold">Success</text>

  <!-- Row 2 (Right to Left) -->
  <rect x="550" y="250" width="180" height="80" rx="10" fill="#ffc9c9" stroke="#333" stroke-width="2"/>
  <text x="640" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">4. Auto-Merge</text>
  <text x="640" y="310" text-anchor="middle" font-size="14" fill="#555">(BOT_PAT)</text>

  <line x1="550" y1="290" x2="490" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="250" width="180" height="80" rx="10" fill="#d0bfff" stroke="#333" stroke-width="2"/>
  <text x="390" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">5. Release PR</text>
  <text x="390" y="310" text-anchor="middle" font-size="14" fill="#555">(Hermes Cron)</text>

  <line x1="300" y1="290" x2="240" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="250" width="180" height="80" rx="10" fill="#b2f2bb" stroke="#333" stroke-width="2"/>
  <text x="140" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">6. Live on</text>
  <text x="140" y="310" text-anchor="middle" font-size="14" fill="#555">StaticVish.github.io</text>
</svg>