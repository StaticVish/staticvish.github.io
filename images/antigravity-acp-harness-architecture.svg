<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    
    <!-- Shadows & Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Antigravity ACP Daemon &amp; Multi-Harness Architecture</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">Decoupling OS Keyring Authentication from Headless Execution via UNIX Domain Sockets</text>

  <!-- ================= TIER 1: CLIENT HARNESSES ================= -->
  <rect x="30" y="90" width="900" height="150" rx="12" fill="#161e2e" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
  <text x="50" y="115" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIER 1: CONSUMER CLIENT HARNESSES (No OAuth / No DBus Required)</text>

  <!-- Harness Card 1: Autonomous Subagents -->
  <rect x="50" y="130" width="195" height="92" rx="8" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="50" y="130" width="195" height="4" rx="2" fill="#3b82f6"/>
  <text x="147" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Autonomous Subagents</text>
  <text x="147" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">Isolated Task Workers</text>
  <text x="147" y="196" text-anchor="middle" font-size="11" fill="#64748b">(Hermes delegate_task)</text>
  <text x="147" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Clean Room / Headless</text>

  <!-- Harness Card 2: CLI Wrapper (agy-sock) -->
  <rect x="270" y="130" width="195" height="92" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.2"/>
  <rect x="270" y="130" width="195" height="4" rx="2" fill="#10b981"/>
  <text x="367" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Socket CLI (agy-sock)</text>
  <text x="367" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">Standard Library Python</text>
  <text x="367" y="196" text-anchor="middle" font-size="11" fill="#64748b">Shell Pipes &amp; Cron Scripts</text>
  <text x="367" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">Drop-in -p / -m / -w CLI</text>

  <!-- Harness Card 3: Modern IDEs & Editors -->
  <rect x="490" y="130" width="195" height="92" rx="8" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="490" y="130" width="195" height="4" rx="2" fill="#a855f7"/>
  <text x="587" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Modern IDEs &amp; Editors</text>
  <text x="587" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">Native ACP Protocol</text>
  <text x="587" y="196" text-anchor="middle" font-size="11" fill="#64748b">Zed, Neovim, Sublime</text>
  <text x="587" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#c084fc">Direct JSON-RPC Stream</text>

  <!-- Harness Card 4: CI/CD & GitOps -->
  <rect x="710" y="130" width="200" height="92" rx="8" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="710" y="130" width="200" height="4" rx="2" fill="#f59e0b"/>
  <text x="810" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">GitOps &amp; Automated CI</text>
  <text x="810" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">Playwright E2E &amp; Test Suites</text>
  <text x="810" y="196" text-anchor="middle" font-size="11" fill="#64748b">Non-interactive Verification</text>
  <text x="810" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">Zero Token Leakage</text>

  <!-- Connectors from Tier 1 to Tier 2 -->
  <path d="M 147 222 L 147 270 L 440 270" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <path d="M 367 222 L 367 270 L 460 270" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <path d="M 587 222 L 587 270 L 500 270" stroke="#a855f7" stroke-width="1.5" fill="none"/>
  <path d="M 810 222 L 810 270 L 520 270" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  
  <line x1="480" y1="270" x2="480" y2="295" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="280" font-size="11" font-weight="600" fill="#38bdf8">JSON-RPC 2.0 (AF_UNIX)</text>

  <!-- ================= TIER 2: IPC & SYSTEMD DAEMON ================= -->
  <rect x="30" y="300" width="900" height="135" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5" filter="url(#dropShadow)"/>
  <text x="50" y="325" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">TIER 2: SOCKET IPC &amp; HOST SYSTEMD SERVICE (Persistent Host Layer)</text>

  <!-- Socket Badge -->
  <rect x="50" y="340" width="410" height="78" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="70" y="365" font-size="13" font-weight="700" fill="#38bdf8">UNIX Domain Socket: 0600 Permissions</text>
  <text x="70" y="388" font-size="12" font-family="monospace" fill="#f8fafc">$XDG_RUNTIME_DIR/antigravity-acp.sock</text>
  <text x="70" y="406" font-size="11" fill="#94a3b8">Fallback: ~/.cache/antigravity-acp.sock (Local IPC only)</text>

  <!-- Systemd Daemon Box -->
  <rect x="490" y="340" width="420" height="78" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="510" y="365" font-size="13" font-weight="700" fill="#34d399">antigravity-acp.service (systemd --user)</text>
  <text x="510" y="388" font-size="11" fill="#f8fafc">ExecStart: Python asyncio bidirectional pipe multiplexer</text>
  <text x="510" y="406" font-size="11" fill="#94a3b8">Bridges AF_UNIX client sockets &lt;---&gt; agy acp stdio child processes</text>

  <!-- Connector from Tier 2 to Tier 3 -->
  <line x1="480" y1="435" x2="480" y2="465" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="495" y="454" font-size="11" font-weight="600" fill="#34d399">stdio Pipe (Child Process Execution)</text>

  <!-- ================= TIER 3: ENGINE & AUTH ================= -->
  <rect x="30" y="470" width="900" height="125" rx="12" fill="#1e1e2e" stroke="#6366f1" stroke-width="1.5" filter="url(#dropShadow)"/>
  <text x="50" y="495" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="1">TIER 3: ANTIGRAVITY ENGINE &amp; GOOGLE CLOUD CODE BACKEND</text>

  <!-- Left: Engine & Keyring -->
  <rect x="50" y="510" width="390" height="68" rx="8" fill="#111827" stroke="#4f46e5" stroke-width="1"/>
  <text x="65" y="532" font-size="13" font-weight="700" fill="#a5b4fc">agy acp --dangerously-skip-permissions</text>
  <text x="65" y="552" font-size="11" fill="#cbd5e1">Authenticated Session: Linux Secret Service (DBus Keyring)</text>
  <text x="65" y="568" font-size="11" fill="#94a3b8">Single warm host login | Zero prompts | No SDK API key billing</text>

  <!-- Center Arrow -->
  <line x1="445" y1="544" x2="485" y2="544" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Google Cloud Code Backend & Models -->
  <rect x="495" y="510" width="415" height="68" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="532" font-size="13" font-weight="700" fill="#fbbf24">Google Cloud Code (daily-cloudcode-pa.googleapis.com)</text>
  <text x="510" y="552" font-size="11" fill="#f8fafc">Backend Models: Gemini 4 Argon/Hydrogen, Gemini 3.8 Flash</text>
  <text x="510" y="568" font-size="11" fill="#94a3b8">Extended Partners: Claude Opus 5.5, Claude Sonnet 5.5, GPT-OSS 120B</text>

</svg>